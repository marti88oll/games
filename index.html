<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vale</title>
  <style>
    :root {
      --bg-color: #f9f9f9;
      --text-color: #222;
      --button-bg: #4CAF50;
      --button-hover: #45a049;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f9f9f9;
      --button-bg: #388e3c;
      --button-hover: #2e7d32;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    button {
      background-color: var(--button-bg);
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    button:hover {
      background-color: var(--button-hover);
      transform: scale(1.05);
    }

    /* Switch estilo toggle (como el de la imagen) */
    .switch {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 28px;
      background-color: #ccc;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .switch::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .switch.active {
      background-color: #4CAF50;
    }

    .switch.active::before {
      transform: translateX(22px);
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body data-theme="light">

  <!-- Interruptor dark/light mode -->
  <div class="switch" id="themeToggle"></div>

  <!-- Botón principal -->
  <button onclick="window.location.href='https://github.com/marti88oll/games/tree/main/Vale_Counter.html'">Vale</button>
  <script>
    // --- Dark/Light mode ---
    const switcher = document.getElementById('themeToggle');
    const body = document.body;

    switcher.addEventListener('click', () => {
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      switcher.classList.toggle('active', !isDark);
    });

    // --- Ejemplo para añadir más botones ---
    /*
      Para añadir un nuevo botón, copia y pega este bloque dentro del <body>:
      
      <button onclick="window.location.href='https://github.com/marti88oll/games/tree/main/NOMBRE_DE_TU_ARCHIVO'">Nombre del botón</button>
      
      🔸 Cambia NOMBRE_DE_TU_ARCHIVO por la carpeta o archivo del repositorio.
      🔸 Cambia "Nombre del botón" por el texto que quieras mostrar.
    */
  </script>
</body>
</html>
