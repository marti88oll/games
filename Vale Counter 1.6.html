<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vale Counter</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --accent-color: #0a84ff;
      --card-color: #1e1e1e;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --background-image: none;
      --counter-size: 6rem;
      --card-scale: 1;
    }
    body {
      margin: 0;
      height: 100vh;
      background-color: var(--bg-color);
      background-image: var(--background-image);
      background-size: cover;
      background-position: center;
      font-family: var(--font);
      color: var(--text-color);
      transition: background-color 0.3s, backdrop-filter 0.3s;
      border-radius: 32px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screen {
      padding: 40px 60px;
      border-radius: 40px;
      text-align: center;
      background-color: var(--card-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s, background-color 0.3s;
      transform: scale(var(--card-scale));
    }
    .liquid-glass {
      background-color: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 40px;
    }
    h1 { font-size: 2rem; margin-bottom: 20px; font-weight: 600; }

    /* Botones principales */
    .btn {
      border-radius: 30px;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .btn:hover {
      background-color: #0077ee;
      transform: translateY(-2px);
    }

    input[type="number"], select {
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background: #fff;
      color: #000;
      outline: none;
    }

    .counter {
      font-size: var(--counter-size);
      font-weight: 700;
      color: var(--accent-color);
      user-select: none;
      border-radius: 40px;
      padding: 20px;
    }

    .combo {
      position: absolute; top: -20px; right: -20px;
      font-size: 1.5rem; font-weight: 600; color: var(--accent-color);
      transform: rotate(20deg); opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }

    .menu-toggle {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--card-color);
      border: none;
      color: var(--text-color);
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .menu {
      position: absolute; top: 60px; left: 15px;
      background: var(--card-color); padding: 20px; border-radius: 32px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: none; flex-direction: column; gap: 15px; width: 260px;
    }
    .menu label {
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Apple style switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      border-radius: 34px;
      transition: .4s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      border-radius: 50%;
      transition: .4s;
    }
    input:checked + .slider {
      background-color: #34c759;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Color button */
    .color-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #ccc;
      cursor: pointer;
    }
    .hidden-color {
      opacity: 0; position: absolute; pointer-events: none;
    }

    body.light {
      --bg-color: #f5f5f7;
      --text-color: #1c1c1e;
      --card-color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Pantalla inicial -->
  <div class="screen" id="start-screen">
    <h1>Vale Counter</h1>
    <p>Introdueix el número inicial (opcional):</p>
    <input type="number" id="start-number" placeholder="0" />
    <br>
    <button class="btn" id="start-btn">Començar de 0</button>
  </div>

  <!-- Menú -->
  <button class="menu-toggle" id="menu-btn" style="display:none;">☰</button>
  <div class="menu" id="menu">
    <label>Modo claro 
      <label class="switch">
        <input type="checkbox" id="theme-toggle"/>
        <span class="slider"></span>
      </label>
    </label>
    <label>Color principal 
      <div>
        <input type="color" id="color-slider" class="hidden-color" value="#0a84ff"/>
        <div id="color-btn" class="color-btn" style="background:#0a84ff;"></div>
      </div>
    </label>
    <label>Fons
      <select id="bg-select">
        <option value="none">Sólido</option>
        <option value="upload">Subir foto</option>
      </select>
      <input type="file" id="bg-file" style="display:none;" accept="image/*"/>
    </label>
    <label>Liquid glass
      <label class="switch">
        <input type="checkbox" id="style-toggle"/>
        <span class="slider"></span>
      </label>
    </label>
    <label>Tamaño tarjeta
      <input type="range" id="size-slider" min="0.7" max="1.3" step="0.05" value="1"/>
    </label>
  </div>

  <!-- Joc -->
  <div class="screen" id="game-screen" style="display:none; position:relative;">
    <h1>Vale Counter</h1>
    <div class="counter" id="counter">0</div>
    <div class="record" id="record">Récord: 0</div>
    <div class="hint">Presiona la barra espaciadora per comptar</div>
    <button class="btn" id="reset-btn">Reset</button>
    <div class="combo" id="combo"></div>
  </div>

  <script>
    let count=0, comboCount=0, record=0, lastPressTime=0, comboTimeout;
    const startScreen=document.getElementById('start-screen');
    const gameScreen=document.getElementById('game-screen');
    const startBtn=document.getElementById('start-btn');
    const startNumber=document.getElementById('start-number');
    const counterEl=document.getElementById('counter');
    const recordEl=document.getElementById('record');
    const comboEl=document.getElementById('combo');
    const resetBtn=document.getElementById('reset-btn');
    const menuBtn=document.getElementById('menu-btn');
    const menu=document.getElementById('menu');
    const themeToggle=document.getElementById('theme-toggle');
    const colorSlider=document.getElementById('color-slider');
    const colorBtn=document.getElementById('color-btn');
    const bgSelect=document.getElementById('bg-select');
    const bgFile=document.getElementById('bg-file');
    const styleToggle=document.getElementById('style-toggle');
    const sizeSlider=document.getElementById('size-slider');

    startNumber.addEventListener('input',()=>{ startBtn.textContent=startNumber.value?"Començar":"Començar de 0"; });

    startBtn.addEventListener('click',()=>{
      count=parseInt(startNumber.value)||0;
      counterEl.textContent=count;
      startScreen.style.display='none';
      gameScreen.style.display='block';
      menuBtn.style.display='flex';
      document.body.style.backgroundImage='var(--background-image)';
    });

    function updateRecord(){
      if(comboCount>record){record=comboCount;recordEl.textContent=`Récord: ${record}`;}
    }

    function updateBackground(combo){
      if(combo>5){
        let progress=Math.min((combo-5)/10,1);
        let r=Math.round(18+(255-18)*progress);
        let g=Math.round(18+(0-18)*progress);
        let b=Math.round(18+(0-18)*progress);
        document.body.style.backgroundColor=`rgb(${r},${g},${b})`;
      }else{
        document.body.style.backgroundColor='var(--bg-color)';
      }
    }

    function showCombo(){
      if(comboCount>=2){ comboEl.textContent=`Combo x${comboCount}`; comboEl.style.opacity='1'; }
      else { comboEl.style.opacity='0'; }
      updateBackground(comboCount);
      clearTimeout(comboTimeout);
      comboTimeout=setTimeout(()=>{
        comboEl.style.opacity='0'; updateRecord(); comboCount=0;
        document.body.style.backgroundColor='var(--bg-color)';
      },5000);
    }

    document.addEventListener('keydown',e=>{
      if(e.code==='Space' && gameScreen.style.display==='block'){
        e.preventDefault();
        count++; counterEl.textContent=count;
        const now=Date.now();
        if(now-lastPressTime<=5000){comboCount++;} else {updateRecord(); comboCount=1;}
        lastPressTime=now; showCombo();
      }
    });

    resetBtn.addEventListener('click',()=>{
      count=0; comboCount=0; record=0; lastPressTime=0;
      counterEl.textContent='0'; recordEl.textContent='Récord: 0';
      comboEl.style.opacity='0'; document.body.style.backgroundColor='var(--bg-color)';
    });

    menuBtn.addEventListener('click',()=>{ menu.style.display=menu.style.display==='flex'?'none':'flex'; });
    themeToggle.addEventListener('change',()=>{ document.body.classList.toggle('light',themeToggle.checked); });

    // Color selector
    colorBtn.addEventListener('click',()=>{ colorSlider.click(); });
    colorSlider.addEventListener('input',()=>{
      document.documentElement.style.setProperty('--accent-color', colorSlider.value);
      colorBtn.style.background=colorSlider.value;
    });

    bgSelect.addEventListener('change',()=>{
      if(bgSelect.value==='upload'){ bgFile.click(); } 
      else { document.body.style.backgroundImage='none'; }
    });

    bgFile.addEventListener('change',()=>{
      const file=bgFile.files[0];
      if(file){
        const reader=new FileReader();
        reader.onload=(e)=>{ document.body.style.backgroundImage=`url(${e.target.result})`; }
        reader.readAsDataURL(file);
      }
    });

    styleToggle.addEventListener('change',()=>{
      if(styleToggle.checked){ gameScreen.classList.add('liquid-glass'); }
      else { gameScreen.classList.remove('liquid-glass'); }
    });

    sizeSlider.addEventListener('input',()=>{
      document.documentElement.style.setProperty('--card-scale', sizeSlider.value);
    });
  </script>
</body>
</html>
